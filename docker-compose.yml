version: "3.9"

networks:
  pulsechain:
    driver: bridge

volumes:
  n8n_data: {}
  postgres_data: {}
  redis_data: {}
  kafka_data: {}
  zookeeper_data: {}
  grafana_data: {}
  prometheus_data: {}

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pc_zookeeper
    networks:
      - pulsechain
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pc_kafka
    networks:
      - pulsechain
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 20"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped


  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pc_kafka_init
    networks:
      - pulsechain
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/topic-init.sh"]
    volumes:
      - ./services/kafka/topic-init.sh:/init/topic-init.sh
    restart: on-failure


  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: pc_timescaledb
    networks:
      - pulsechain
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pulsechain
      POSTGRES_USER: pulsechain
      POSTGRES_PASSWORD: pulsechain_secure_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/timescaledb/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsechain"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  redis:
    image: redis:7.2-alpine
    container_name: pc_redis
    networks:
      - pulsechain
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./services/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped


  n8n:
    image: n8nio/n8n:latest
    container_name: pc_n8n
    networks:
      - pulsechain
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: pulsechain
      DB_POSTGRESDB_HOST: timescaledb
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: pulsechain
      DB_POSTGRESDB_PASSWORD: pulsechain_secure_pass

      EXECUTIONS_MODE: queue
      N8N_EXECUTIONS_PROCESS: main

      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379

      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"

      N8N_ENCRYPTION_KEY: pulsechain-super-secure-key-32chr

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_METRICS: "true"

      KAFKA_BROKERS: kafka:9092

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    restart: unless-stopped


  n8n-worker:
    image: n8nio/n8n:latest
    container_name: pc_n8n_worker
    command: worker
    networks:
      - pulsechain
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: pulsechain
      DB_POSTGRESDB_HOST: timescaledb
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: pulsechain
      DB_POSTGRESDB_PASSWORD: pulsechain_secure_pass

      EXECUTIONS_MODE: queue
      N8N_EXECUTIONS_PROCESS: worker

      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379

      N8N_ENCRYPTION_KEY: pulsechain-super-secure-key-32chr

    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped


  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: pc_api
    networks:
      - pulsechain
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://pulsechain:pulsechain_secure_pass@timescaledb:5432/pulsechain
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./ml:/app/ml
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pc_frontend
    networks:
      - pulsechain
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: pc_prometheus
    networks:
      - pulsechain
    ports:
      - "9090:9090"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped


  grafana:
    image: grafana/grafana:10.2.0
    container_name: pc_grafana
    networks:
      - pulsechain
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pulsechain
    volumes:
      - grafana_data:/var/lib/grafana
      - ./services/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    restart: unless-stopped
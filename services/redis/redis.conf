# PulseChain Redis Configuration
# Used as n8n queue backend (Bull) and rate limiter

# Persistence
save 900 1
save 300 10
save 60 10000

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Network
bind 0.0.0.0
protected-mode no
port 6379

# Logging
loglevel notice

# AOF
appendonly yes
appendfsync everysec